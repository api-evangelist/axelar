apis:
- aid: axelar:axelarscan
  name: Axelarscan API
  description: >-
    Retrieves information about the Axelar network and the AXL token. Provides access to metrics such
    as circulating supply, total supply, inflation, total value locked (TVL) across 80+ chains and 30+
    assets, network proposals, and overall chain health. Backed by OpenSearch-cached data for sub-second
    responses on mainnet.
  humanURL: https://docs.axelarscan.io/axelarscan
  baseURL: https://api.axelarscan.io/api
  tags:
  - Network Stats
  - TVL
  - AXL Token
  - Analytics
  properties:
  - type: Documentation
    url: https://docs.axelarscan.io/axelarscan
- aid: axelar:validator
  name: Axelar Validator API
  description: >-
    Exposes metrics for validators operating on the Axelar network, including heartbeat status, uptime
    percentages, proposed block counts, voting participation, and quadratic voting scores. Useful for
    delegators evaluating validator performance and for monitoring infrastructure reliability across the
    75+ active validators.
  humanURL: https://docs.axelarscan.io/validator
  baseURL: https://api.axelarscan.io/api
  tags:
  - Validators
  - Staking
  - Network Health
  - Metrics
  properties:
  - type: Documentation
    url: https://docs.axelarscan.io/validator
- aid: axelar:token-transfer
  name: Axelar Token Transfer API
  description: >-
    Provides insights into cross-chain token transfers executed through the Axelar network. Returns transfer
    status, source and destination chain details, asset denomination, amounts, confirmation counts, and
    historical transfer statistics. Supports both gateway token transfers and Interchain Token Service
    (ITS) transfers.
  humanURL: https://docs.axelarscan.io/token-transfer
  baseURL: https://api.axelarscan.io/api
  tags:
  - Token Transfer
  - Cross-Chain
  - ITS
  - Bridge
  properties:
  - type: Documentation
    url: https://docs.axelarscan.io/token-transfer
- aid: axelar:gmp
  name: Axelar GMP API
  description: >-
    Returns information about General Message Passing (GMP) calls routed through the Axelar network. Provides
    transaction status, source and destination chain data, contract call payloads, gas payment status,
    gas estimation, and recovery details for stuck or underfunded cross-chain transactions. Complements
    the AxelarJS SDK GMP recovery methods.
  humanURL: https://docs.axelarscan.io/gmp
  baseURL: https://api.axelarscan.io/api
  tags:
  - GMP
  - General Message Passing
  - Cross-Chain Calls
  - Gas Estimation
  properties:
  - type: Documentation
    url: https://docs.axelarscan.io/gmp
- aid: axelar:axelarjs-sdk
  name: AxelarJS SDK
  description: >-
    JavaScript/TypeScript SDK wrapping common cross-chain operations on the Axelar network. Key classes
    include AxelarAssetTransfer (generates deposit addresses for token transfers), AxelarQueryAPI (fee
    estimation, denom lookups, transfer status), and AxelarGMPRecoveryAPI (query GMP transaction status,
    manual relay, execute destination contract, add gas). Supports both MAINNET and TESTNET environments.
  humanURL: https://docs.axelar.dev/dev/axelarjs-sdk/intro/
  baseURL: https://github.com/axelarnetwork/axelarjs-sdk
  tags:
  - SDK
  - JavaScript
  - TypeScript
  - npm
  - Token Transfer
  - GMP Recovery
