openapi: 3.2.0
info:
  title: Amplifier GMP Chains API
  description: Integration layer for Amplifier chains
  version: 1.0.0
tags:
- name: Chains
paths:
  /chains/{chain}/events:
    post:
      summary: Publish on-chain events
      operationId: publishEvents
      parameters:
      - $ref: '#/components/parameters/chain'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishEventsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishEventsResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chain Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Chains
  /chains/{chain}/tasks:
    get:
      summary: Poll transaction to be executed on chain
      operationId: getTasks
      parameters:
      - $ref: '#/components/parameters/chain'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTasksResult'
        '404':
          description: Chain Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Chains
  /chains/{chain}/tasks/{taskItemID}:
    get:
      summary: Retrieve a transaction to be executed on-chain by id
      operationId: getTask
      parameters:
      - $ref: '#/components/parameters/chain'
      - $ref: '#/components/parameters/taskItemID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskResult'
        '404':
          description: Chain Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Chains
components:
  schemas:
    ITSInterchainTransferReceivedEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          sourceChain:
            type: string
            minLength: 1
          sourceAddress:
            type: string
            format: byte
            minLength: 1
          destinationAddress:
            $ref: '#/components/schemas/Address'
          tokenReceived:
            $ref: '#/components/schemas/InterchainTransferTokenWithID'
          dataHash:
            type: string
            format: byte
            minLength: 0
        required:
        - messageID
        - sourceChain
        - sourceAddress
        - destinationAddress
        - tokenReceived
        - dataHash
    TaskMetadata:
      allOf:
      - $ref: '#/components/schemas/DestinationChainTaskMetadata'
      - $ref: '#/components/schemas/SourceChainTaskMetadata'
    AppEventMetadata:
      allOf:
      - $ref: '#/components/schemas/EventMetadata'
      - properties:
          emittedByAddress:
            allOf:
            - $ref: '#/components/schemas/Address'
            x-omitempty: true
    CallEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          meta:
            allOf:
            - $ref: '#/components/schemas/CallEventMetadata'
            x-omitempty: true
      - properties:
          message:
            $ref: '#/components/schemas/Message'
          destinationChain:
            type: string
            minLength: 1
          payload:
            type: string
            format: byte
          withToken:
            $ref: '#/components/schemas/UnsignedTokenWithRequiredID'
        required:
        - message
        - destinationChain
        - payload
    ReactToWasmEventTask:
      properties:
        height:
          type: integer
          format: int64
          minimum: 0
        event:
          $ref: '#/components/schemas/WasmEvent'
      required:
      - height
      - event
    CannotExecuteTaskReason:
      type: string
      enum:
      - CUSTOM
      - ERROR
      - INSUFFICIENT_GAS
      - TX_REVERTED
      x-enum-varnames:
      - CannotExecuteTaskReasonCustom
      - CannotExecuteTaskReasonError
      - CannotExecuteTaskReasonInsufficientGas
      - CannotExecuteTaskReasonTxReverted
    ITSLinkTokenReceivedEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          tokenID:
            $ref: '#/components/schemas/TokenID'
          sourceChain:
            type: string
            minLength: 1
          sourceTokenAddress:
            type: string
            format: byte
            minLength: 1
          destinationTokenAddress:
            type: string
            format: byte
            minLength: 1
          tokenManagerType:
            $ref: '#/components/schemas/TokenManagerType'
        required:
        - messageID
        - tokenID
        - sourceChain
        - sourceTokenAddress
        - destinationTokenAddress
        - tokenManagerType
    InterchainTokenDefinition:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          x-go-name: ID
        name:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
        decimals:
          type: integer
          format: uint8
          minimum: 0
      required:
      - id
      - name
      - symbol
      - decimals
    AppInterchainTransferReceivedEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          meta:
            allOf:
            - $ref: '#/components/schemas/AppEventMetadata'
            x-omitempty: true
      - properties:
          messageID:
            type: string
            minLength: 1
          sourceChain:
            type: string
            minLength: 1
          sourceAddress:
            $ref: '#/components/schemas/Address'
          sender:
            type: string
            format: byte
          recipient:
            $ref: '#/components/schemas/Address'
          tokenReceived:
            $ref: '#/components/schemas/InterchainTransferTokenWithAddress'
        required:
        - messageID
        - sourceChain
        - sourceAddress
        - sender
        - recipient
        - tokenReceived
    MessageExecutedEvent:
      deprecated: true
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          meta:
            allOf:
            - $ref: '#/components/schemas/MessageExecutedEventMetadata'
            x-omitempty: true
      - properties:
          messageID:
            type: string
            minLength: 1
          sourceChain:
            type: string
            minLength: 1
          status:
            $ref: '#/components/schemas/MessageExecutionStatus'
          cost:
            $ref: '#/components/schemas/Cost'
        required:
        - messageID
        - sourceChain
        - status
        - cost
    EventBase:
      type: object
      properties:
        eventID:
          type: string
          minLength: 1
        meta:
          allOf:
          - $ref: '#/components/schemas/EventMetadata'
          x-omitempty: true
      required:
      - eventID
    SourceChainTaskMetadata:
      description: 'Metadata attached to REFUND and VERIFY tasks. It carries values passed in the associated CALL event (if any) back to the source chain.

        '
      type: object
      properties:
        sourceContext:
          $ref: '#/components/schemas/MessageContext'
    ITSLinkTokenStartedEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          tokenID:
            $ref: '#/components/schemas/TokenID'
          destinationChain:
            type: string
            minLength: 1
          sourceTokenAddress:
            type: string
            format: byte
            minLength: 1
          destinationTokenAddress:
            type: string
            format: byte
            minLength: 1
          tokenManagerType:
            $ref: '#/components/schemas/TokenManagerType'
        required:
        - messageID
        - tokenID
        - destinationChain
        - sourceTokenAddress
        - destinationTokenAddress
        - tokenManagerType
    MessageApprovedEventMetadata:
      allOf:
      - $ref: '#/components/schemas/EventMetadata'
      - properties:
          commandID:
            type:
            - string
            - 'null'
            x-omitempty: true
            minLength: 1
    Cost:
      anyOf:
      - $ref: '#/components/schemas/UnsignedToken'
      - $ref: '#/components/schemas/Fees'
    FeeMetadata:
      type: object
      properties:
        txID:
          type:
          - string
          - 'null'
          x-omitempty: true
          minLength: 1
    ConstructProofTask:
      properties:
        message:
          $ref: '#/components/schemas/Message'
        payload:
          type: string
          format: byte
          minLength: 1
      required:
      - message
      - payload
    TokenManagerType:
      type: string
      enum:
      - NATIVE_INTERCHAIN_TOKEN
      - MINT_BURN_FROM
      - LOCK_UNLOCK
      - LOCK_UNLOCK_FEE
      - MINT_BURN
      x-enum-varnames:
      - TokenManagerNativeInterchainToken
      - TokenManagerMintBurnFrom
      - TokenManagerLockUnlock
      - TokenManagerLockUnlockFee
      - TokenManagerMintBurn
    MessageApprovedEvent:
      deprecated: true
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          meta:
            allOf:
            - $ref: '#/components/schemas/MessageApprovedEventMetadata'
            x-omitempty: true
      - properties:
          message:
            $ref: '#/components/schemas/Message'
          cost:
            $ref: '#/components/schemas/Cost'
        required:
        - message
        - cost
    GatewayTransactionTask:
      properties:
        executeData:
          type: string
          format: byte
          minLength: 1
      required:
      - executeData
    Event:
      oneOf:
      - $ref: '#/components/schemas/GasCreditEvent'
      - $ref: '#/components/schemas/GasRefundedEvent'
      - $ref: '#/components/schemas/CallEvent'
      - $ref: '#/components/schemas/MessageApprovedEvent'
      - $ref: '#/components/schemas/MessageExecutedEvent'
      - $ref: '#/components/schemas/MessageExecutedEventV2'
      - $ref: '#/components/schemas/CannotExecuteMessageEvent'
      - $ref: '#/components/schemas/CannotExecuteMessageEventV2'
      - $ref: '#/components/schemas/CannotRouteMessageEvent'
      - $ref: '#/components/schemas/CannotExecuteTaskEvent'
      - $ref: '#/components/schemas/SignersRotatedEvent'
      - $ref: '#/components/schemas/ITSLinkTokenStartedEvent'
      - $ref: '#/components/schemas/ITSTokenMetadataRegisteredEvent'
      - $ref: '#/components/schemas/ITSInterchainTokenDeploymentStartedEvent'
      - $ref: '#/components/schemas/ITSInterchainTransferEvent'
      - $ref: '#/components/schemas/ITSInterchainTransferReceivedEvent'
      - $ref: '#/components/schemas/ITSInterchainTokenDeployedEvent'
      - $ref: '#/components/schemas/ITSTokenManagerDeployedEvent'
      - $ref: '#/components/schemas/ITSLinkTokenReceivedEvent'
      - $ref: '#/components/schemas/ITSFlowLimitSetEvent'
      - $ref: '#/components/schemas/AppInterchainTransferSentEvent'
      - $ref: '#/components/schemas/AppInterchainTransferReceivedEvent'
      discriminator:
        propertyName: type
        mapping:
          GAS_CREDIT: '#/components/schemas/GasCreditEvent'
          GAS_REFUNDED: '#/components/schemas/GasRefundedEvent'
          CALL: '#/components/schemas/CallEvent'
          MESSAGE_APPROVED: '#/components/schemas/MessageApprovedEvent'
          MESSAGE_EXECUTED: '#/components/schemas/MessageExecutedEvent'
          MESSAGE_EXECUTED/V2: '#/components/schemas/MessageExecutedEventV2'
          CANNOT_EXECUTE_MESSAGE: '#/components/schemas/CannotExecuteMessageEvent'
          CANNOT_EXECUTE_MESSAGE/V2: '#/components/schemas/CannotExecuteMessageEventV2'
          CANNOT_ROUTE_MESSAGE: '#/components/schemas/CannotRouteMessageEvent'
          CANNOT_EXECUTE_TASK: '#/components/schemas/CannotExecuteTaskEvent'
          SIGNERS_ROTATED: '#/components/schemas/SignersRotatedEvent'
          ITS/LINK_TOKEN_STARTED: '#/components/schemas/ITSLinkTokenStartedEvent'
          ITS/TOKEN_METADATA_REGISTERED: '#/components/schemas/ITSTokenMetadataRegisteredEvent'
          ITS/INTERCHAIN_TOKEN_DEPLOYMENT_STARTED: '#/components/schemas/ITSInterchainTokenDeploymentStartedEvent'
          ITS/INTERCHAIN_TRANSFER: '#/components/schemas/ITSInterchainTransferEvent'
          ITS/INTERCHAIN_TRANSFER_RECEIVED: '#/components/schemas/ITSInterchainTransferReceivedEvent'
          ITS/INTERCHAIN_TOKEN_DEPLOYED: '#/components/schemas/ITSInterchainTokenDeployedEvent'
          ITS/TOKEN_MANAGER_DEPLOYED: '#/components/schemas/ITSTokenManagerDeployedEvent'
          ITS/LINK_TOKEN_RECEIVED: '#/components/schemas/ITSLinkTokenReceivedEvent'
          ITS/FLOW_LIMIT_SET: '#/components/schemas/ITSFlowLimitSetEvent'
          APP/INTERCHAIN_TRANSFER_SENT: '#/components/schemas/AppInterchainTransferSentEvent'
          APP/INTERCHAIN_TRANSFER_RECEIVED: '#/components/schemas/AppInterchainTransferReceivedEvent'
      properties:
        type:
          $ref: '#/components/schemas/EventType'
      required:
      - type
    PublishEventAcceptedResult:
      allOf:
      - $ref: '#/components/schemas/PublishEventResultItemBase'
      - properties: {}
    ReactToRetriablePollTask:
      properties:
        pollID:
          type: integer
          format: uint64
        broadcastID:
          $ref: '#/components/schemas/BroadcastID'
        invokedContractAddress:
          $ref: '#/components/schemas/Address'
        requestPayload:
          $ref: '#/components/schemas/WasmRequest'
        quorumReachedEvents:
          type: array
          items:
            $ref: '#/components/schemas/QuorumReachedEvent'
      required:
      - pollID
      - broadcastID
      - invokedContractAddress
      - requestPayload
      - quorumReachedEvents
    PublishEventStatus:
      type: string
      enum:
      - ACCEPTED
      - ERROR
      x-enum-varnames:
      - PublishEventStatusAccepted
      - PublishEventStatusError
    GasCreditEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          refundAddress:
            $ref: '#/components/schemas/Address'
          payment:
            $ref: '#/components/schemas/UnsignedToken'
        required:
        - messageID
        - refundAddress
        - payment
    EventMetadata:
      type: object
      properties:
        txID:
          type:
          - string
          - 'null'
          x-omitempty: true
          minLength: 1
        timestamp:
          type: string
          format: date-time
        fromAddress:
          allOf:
          - $ref: '#/components/schemas/Address'
          x-omitempty: true
        finalized:
          type:
          - boolean
          - 'null'
          x-omitempty: true
          default: true
    UnsignedTokenWithRequiredID:
      type: object
      properties:
        tokenID:
          $ref: '#/components/schemas/TokenID'
        amount:
          $ref: '#/components/schemas/UnsignedBigInt'
      required:
      - tokenID
      - amount
    CannotRouteMessageEvent:
      deprecated: true
      description: 'Event emitted when a message cannot be routed. Source chain of the message is implied to be the chain from which the event is emitted.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          reason:
            $ref: '#/components/schemas/CannotRouteMessageReason'
          details:
            type: string
            minLength: 1
        required:
        - messageID
        - reason
        - details
    UnsignedToken:
      type: object
      properties:
        tokenID:
          allOf:
          - $ref: '#/components/schemas/TokenID'
          x-omitempty: true
        amount:
          $ref: '#/components/schemas/UnsignedBigInt'
      required:
      - amount
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          minLength: 1
        requestID:
          type: string
          minLength: 1
      required:
      - error
    MessageContext:
      type: object
      additionalProperties:
        type: string
        maxLength: 1000
      maxProperties: 10
    GetTaskResult:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/TaskItem'
      required:
      - task
    InterchainTransferTokenWithAddress:
      type: object
      properties:
        tokenAddress:
          $ref: '#/components/schemas/Address'
        amount:
          $ref: '#/components/schemas/UnsignedBigInt'
      required:
      - tokenAddress
      - amount
    MessageExecutedEventV2:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          meta:
            allOf:
            - $ref: '#/components/schemas/MessageExecutedEventMetadata'
            x-omitempty: true
      - properties:
          crossChainID:
            $ref: '#/components/schemas/CrossChainID'
          cost:
            $ref: '#/components/schemas/Cost'
        required:
        - crossChainID
        - cost
    CannotExecuteTaskEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          taskItemID:
            $ref: '#/components/schemas/TaskItemID'
          reason:
            $ref: '#/components/schemas/CannotExecuteTaskReason'
          details:
            type: string
            minLength: 1
          cost:
            $ref: '#/components/schemas/Cost'
        required:
        - taskItemID
        - reason
        - details
    InterchainTransferTokenWithID:
      type: object
      properties:
        tokenID:
          $ref: '#/components/schemas/TokenID'
        amount:
          $ref: '#/components/schemas/UnsignedBigInt'
      required:
      - tokenID
      - amount
    PublishEventsResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublishEventResultItem'
      required:
      - results
    CrossChainID:
      type: object
      properties:
        sourceChain:
          type: string
          minLength: 1
        messageID:
          type: string
          minLength: 1
      required:
      - sourceChain
      - messageID
    TaskItemID:
      type: string
      minLength: 1
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid
        name: uuid
    TaskType:
      type: string
      enum:
      - CONSTRUCT_PROOF
      - EXECUTE
      - GATEWAY_TX
      - REACT_TO_WASM_EVENT
      - REFUND
      - VERIFY
      - REACT_TO_EXPIRED_SIGNING_SESSION
      - REACT_TO_RETRIABLE_POLL
      x-enum-varnames:
      - TaskTypeConstructProof
      - TaskTypeExecute
      - TaskTypeGatewayTransaction
      - TaskTypeReactToWasmEvent
      - TaskTypeRefund
      - TaskTypeVerify
      - TaskTypeReactToExpiredSigningSession
      - TaskTypeReactToRetriablePoll
    Fee:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/FeeMetadata'
        id:
          type: string
          minLength: 1
          x-go-name: ID
        description:
          type: string
        token:
          $ref: '#/components/schemas/UnsignedToken'
      required:
      - id
      - token
    ITSTokenMetadataRegisteredEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          address:
            $ref: '#/components/schemas/Address'
          decimals:
            type: integer
            format: uint8
            minimum: 0
        required:
        - messageID
        - address
        - decimals
    PublishEventResultItem:
      oneOf:
      - $ref: '#/components/schemas/PublishEventAcceptedResult'
      - $ref: '#/components/schemas/PublishEventErrorResult'
      discriminator:
        propertyName: status
        mapping:
          ACCEPTED: '#/components/schemas/PublishEventAcceptedResult'
          ERROR: '#/components/schemas/PublishEventErrorResult'
    QuorumReachedEvent:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        content:
          x-go-type: json.RawMessage
      required:
      - status
      - content
    Message:
      type: object
      properties:
        messageID:
          type: string
          minLength: 1
        sourceChain:
          type: string
          minLength: 1
        sourceAddress:
          $ref: '#/components/schemas/Address'
        destinationAddress:
          $ref: '#/components/schemas/Address'
        payloadHash:
          type: string
          format: byte
          minLength: 1
      required:
      - messageID
      - sourceChain
      - sourceAddress
      - destinationAddress
      - payloadHash
    TokenID:
      type: string
    ITSInterchainTokenDeploymentStartedEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          destinationChain:
            type: string
            minLength: 1
          token:
            $ref: '#/components/schemas/InterchainTokenDefinition'
        required:
        - destinationChain
        - messageID
        - token
    WasmEvent:
      type: object
      properties:
        type:
          type: string
          minLength: 1
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/WasmEventAttribute'
      required:
      - type
      - attributes
    VerifyTask:
      properties:
        message:
          $ref: '#/components/schemas/Message'
        destinationChain:
          type: string
          minLength: 1
        payload:
          type: string
          format: byte
          minLength: 1
      required:
      - message
      - destinationChain
      - payload
    ITSInterchainTransferEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          destinationChain:
            type: string
            minLength: 1
          tokenSpent:
            $ref: '#/components/schemas/InterchainTransferTokenWithID'
          sourceAddress:
            $ref: '#/components/schemas/Address'
          destinationAddress:
            type: string
            format: byte
            minLength: 1
          dataHash:
            type: string
            format: byte
            minLength: 0
        required:
        - messageID
        - destinationChain
        - tokenSpent
        - sourceAddress
        - destinationAddress
        - dataHash
    GasRefundedEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          messageID:
            type: string
            minLength: 1
          recipientAddress:
            $ref: '#/components/schemas/Address'
          refundedAmount:
            $ref: '#/components/schemas/UnsignedToken'
          cost:
            $ref: '#/components/schemas/Cost'
        required:
        - messageID
        - recipientAddress
        - refundedAmount
        - cost
    CallEventMetadata:
      allOf:
      - $ref: '#/components/schemas/EventMetadata'
      - properties:
          parentMessageID:
            type:
            - string
            - 'null'
            x-omitempty: true
            minLength: 1
          parentSourceChain:
            type:
            - string
            - 'null'
            x-omitempty: true
            minLength: 1
          senderContractAddress:
            allOf:
            - $ref: '#/components/schemas/Address'
            x-omitempty: true
          sourceContext:
            $ref: '#/components/schemas/MessageContext'
    ExecuteTask:
      properties:
        message:
          $ref: '#/components/schemas/Message'
        payload:
          type: string
          format: byte
          minLength: 1
        availableGasBalance:
          $ref: '#/components/schemas/Token'
      required:
      - message
      - payload
      - availableGasBalance
    WasmRequestWithStringBody:
      type: string
      minLength: 1
    CannotExecuteMessageEventMetadata:
      deprecated: true
      type: object
      properties:
        fromAddress:
          allOf:
          - $ref: '#/components/schemas/Address'
          x-omitempty: true
        timestamp:
          type: string
          format: date-time
    MessageExecutionStatus:
      deprecated: true
      type: string
      enum:
      - SUCCESSFUL
      - REVERTED
      x-enum-varnames:
      - MessageExecutionStatusSuccessful
      - MessageExecutionStatusReverted
    SignersRotatedEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          meta:
            allOf:
            - $ref: '#/components/schemas/SignersRotatedEventMetadata'
            x-omitempty: true
      - properties:
          messageID:
            type: string
            minLength: 1
        required:
        - messageID
    ITSFlowLimitSetEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - properties:
          tokenID:
            $ref: '#/components/schemas/TokenID'
          operator:
            $ref: '#/components/schemas/Address'
          flowLimit:
            $ref: '#/components/schemas/UnsignedBigInt'
        required:
